name: Crate release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Qualified version tag or commit; defaults to main
        required: false
        default: main
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rust-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'debugbundle/debugbundle-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      sha256: ${{ steps.plan.outputs.sha256 }}
      authentication: ${{ steps.plan.outputs.authentication }}
      already_published: ${{ steps.plan.outputs.already_published }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          path: release-tools
          persist-credentials: false
      - name: Check release orchestration without rebuilding the SDK
        working-directory: release-tools
        run: make test-release-tools workflows-check
      - name: Resolve exact source and reuse its complete passing qualification
        id: plan
        working-directory: release-tools
        run: python3 scripts/release-plan.py --ref "$RELEASE_REF" --output "$GITHUB_WORKSPACE/.tmp/release" --wait-seconds 3600
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref || github.ref }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-release-candidate
          path: .tmp/release/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain planning diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-release-plan
          path: .tmp/release/
          include-hidden-files: true
          if-no-files-found: warn
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: crates-io
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA256: ${{ needs.prepare.outputs.sha256 }}
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      DEBUGBUNDLE_CANDIDATE_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - name: Initialize release receipts before any checkout or preflight
        run: mkdir -p .tmp/release && printf '%s\n' 'Release job started' > .tmp/release/start.txt
      - uses: actions/checkout@v6.0.2
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: sdk
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rust-release-candidate
          path: .tmp/selected/
      - name: Repackage qualified source and verify exact bytes before credentials
        if: needs.prepare.outputs.already_published != 'true'
        run: python3 release-tools/scripts/run-release.py preflight --source sdk --artifact ".tmp/selected/candidate/debugbundle-$RELEASE_VERSION.crate" --receipts .tmp/release
      - name: Obtain temporary trusted publishing credential
        if: needs.prepare.outputs.authentication == 'trusted'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish through trusted identity
        if: needs.prepare.outputs.authentication == 'trusted'
        run: python3 release-tools/scripts/run-release.py publish --source sdk --artifact ".tmp/selected/candidate/debugbundle-$RELEASE_VERSION.crate" --receipts .tmp/release
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Bootstrap the first crate
        if: needs.prepare.outputs.authentication == 'bootstrap'
        run: python3 release-tools/scripts/run-release.py publish --source sdk --artifact ".tmp/selected/candidate/debugbundle-$RELEASE_VERSION.crate" --receipts .tmp/release
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Verify public checksum and genuinely installed applications
        run: python3 release-tools/scripts/run-release.py verify --source sdk --artifact ".tmp/selected/candidate/debugbundle-$RELEASE_VERSION.crate" --receipts .tmp/release
      - name: Create the versioned GitHub release after registry acceptance
        run: python3 release-tools/scripts/finish-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: .tmp/selected/candidate/debugbundle-${{ needs.prepare.outputs.version }}.crate
      - name: Keep release and registry receipts, including early failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-release-receipts
          path: |
            .tmp/release/
            sdk/.tmp/release/
            sdk/.tmp/published-registry/
          include-hidden-files: true
          if-no-files-found: warn
