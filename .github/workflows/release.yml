name: Manual crate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already qualified on this commit
        required: true
        type: string
      sha256:
        description: SHA-256 from that commit's rust-candidate artifact
        required: true
        type: string
      authentication:
        description: Bootstrap token for the first crate; trusted publishing after owner setup
        required: true
        type: choice
        options: [trusted, bootstrap]
permissions:
  contents: read
concurrency:
  group: rust-release
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: qualify
    if: github.repository == 'debugbundle/debugbundle-rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA256: ${{ inputs.sha256 }}
      RELEASE_SOURCE_SHA: ${{ github.sha }}
      DEBUGBUNDLE_CANDIDATE_SHA256: ${{ needs.qualify.outputs.candidate_sha256 }}
      DEBUGBUNDLE_CANDIDATE_ARTIFACT: /work/.tmp/selected/debugbundle-${{ needs.qualify.outputs.candidate_version }}.crate
      QUALIFIED_VERSION: ${{ needs.qualify.outputs.candidate_version }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rust-candidate
          path: .tmp/selected/
      - name: Match owner-selected version and checksum before obtaining a publishing credential
        run: |
          test "$RELEASE_VERSION" = "$QUALIFIED_VERSION"
          test "$RELEASE_SHA256" = "$DEBUGBUNDLE_CANDIDATE_SHA256"
          make release-preflight
      - name: Obtain short-lived trusted publishing token
        if: inputs.authentication == 'trusted'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish using the explicitly selected trusted identity
        if: inputs.authentication == 'trusted'
        run: make release-publish
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish first crate using the explicitly selected bootstrap credential
        if: inputs.authentication == 'bootstrap'
        run: make release-publish
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Verify public checksum and genuinely installed applications
        run: make smoke-published
      - name: Keep release and registry receipts, including partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-release-receipts
          path: |
            .tmp/release/
            .tmp/published-registry/
          include-hidden-files: true
          if-no-files-found: error
