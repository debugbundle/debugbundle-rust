name: SDK resource baseline measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Record source and runner identity
        run: |
          mkdir -p .tmp/performance
          git rev-parse HEAD > .tmp/performance/commit.txt
          uname -a > .tmp/performance/host.txt
          lscpu >> .tmp/performance/host.txt
          find src smoke/performance/src -type f -name '*.rs' -print0 | sort -z | xargs -0 sha256sum > .tmp/performance/source-files.txt
      - name: Three identical bounded resource measurements
        run: |
          make evidence-performance PERFORMANCE_REPORT=.tmp/performance/one.json
          make evidence-performance PERFORMANCE_REPORT=.tmp/performance/two.json
          make evidence-performance PERFORMANCE_REPORT=.tmp/performance/three.json
      - name: Keep measurements without claiming baseline acceptance
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-resource-measurements-${{ github.run_attempt }}
          path: .tmp/performance/
          include-hidden-files: true
          if-no-files-found: error
